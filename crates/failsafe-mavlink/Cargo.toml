[package]
name = "failsafe-mavlink"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
udp = ["mavlink/transport-udp"]

[dependencies]
failsafe-core = { path = "../failsafe-core" }
mavlink = { version = "0.20", default-features = false, features = ["std", "dialect-common"] }
mavlink-core = "0.20"
clap = { version = "4.6.7", features = ["derive"] }

[[bin]]
name = "failsafe-mavlink"
path = "src/main.rs"
