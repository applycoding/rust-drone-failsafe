[package]
name = "failsafe-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
failsafe-core = { path = "../failsafe-core" }
failsafe-sim = { path = "../failsafe-sim" }
wasm-bindgen = "=0.2.129"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
