[package]
name = "failsafe-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
failsafe-core = { path = "../failsafe-core" }
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
csv = "1.4.0"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"

[[bin]]
name = "failsafe-sim"
path = "src/main.rs"
